# @package _global_.model.policy
# Phase-2: frozen distilled student encoder + train MAR/action head.
defaults:
  - small

use_student_tokenizer: true

align_params:
  enable: false

distill_params:
  distill_only: false
  freeze_student: true
  loss_type: mse
  teacher_mode: sample

# Set via CLI, e.g. model.policy.student_tokenizer_pretrained_path=checkpoints/.../latest.ckpt
student_tokenizer_pretrained_path: null
