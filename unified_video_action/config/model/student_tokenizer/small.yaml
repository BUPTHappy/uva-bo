# @package _global_.model.policy
# Smaller ViT encoder than encoder-matched preset (~0.6× frozen KL-VAE encoder + quant_conv).
defaults:
  - _base

student_tokenizer_params:
  img_size: 256
  patch_size: 16
  in_channels: 3
  latent_channels: 16
  hidden_dim: 304
  depth: 5
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  use_temporal_mixer: true
  temporal_kernel_size: 3
