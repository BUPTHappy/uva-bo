# @package _global_.model.policy
# ~30M params (~0.43x KL-VAE). Matches the manual CLI overrides used in recent libero10 runs.
defaults:
  - _base

student_tokenizer_params:
  img_size: 256
  patch_size: 16
  in_channels: 3
  latent_channels: 16
  hidden_dim: 384
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  use_temporal_mixer: true
  temporal_kernel_size: 3
