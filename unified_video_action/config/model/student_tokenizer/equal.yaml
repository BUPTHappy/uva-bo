# @package _global_.model.policy
# ~70M params (~1.00x KL-VAE total). Wider/deeper ViT-style student encoder.
defaults:
  - _base

student_tokenizer_params:
  img_size: 256
  patch_size: 16
  in_channels: 3
  latent_channels: 16
  hidden_dim: 448
  depth: 18
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  use_temporal_mixer: true
  temporal_kernel_size: 3
