# @package _global_.model.policy
# Sized to roughly match frozen KL-VAE `AutoencoderKL` total trainable params
# (~66–67M depending on Torch build; Torch count is authoritative).
defaults:
  - _base

student_tokenizer_params:
  img_size: 256
  patch_size: 16
  in_channels: 3
  latent_channels: 16
  hidden_dim: 416
  depth: 21
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  use_temporal_mixer: true
  temporal_kernel_size: 3
