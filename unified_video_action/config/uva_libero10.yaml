name: uva

defaults:
  - _self_
  - task: libero10
  - model: uva

dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false

training:
  checkpoint_every: 50
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3050
  resume: true
  # Must exist in config for Hydra struct overrides; relax if ckpt keys differ
  resume_strict: true
  resume_load_optimizer: true
  # true = do not load Libero sim during training (use eval_sim.py on 1 GPU instead)
  skip_rollout: false
  # Multi-GPU + MuJoCo/EGL often SIGSEGV in-process; set true to run eval_sim.py in a
  # subprocess after each checkpoint (see rollout_subprocess_cuda_visible_devices).
  rollout_subprocess: false
  rollout_subprocess_device: cuda:0
  # Subprocess only sees this GPU (e.g. pick an idle GPU; "0" re-maps to cuda:0 in that process)
  rollout_subprocess_cuda_visible_devices: "0"
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
  # bf16 is much more stable than fp16 for joint video+policy + align (fp16 often -> NaN).
  mixed_precision: bf16
  # Strongly recommended for task.task_modes with multiple heads (video + policy, etc.).
  max_grad_norm: 1.0
  
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: test_mean_score
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 1
    mode: max

ema:
  _target_: unified_video_action.model.autoregressive.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

logging:
  group: null
  id: null
  mode: online
  name: train_uva_libero10
  project: unified_video_action
  resume: true
  tags:
  - train_uva_libero10
  - libero10
  - default

multi_run:
  run_dir: data/outputs/train_uva_libero10
  wandb_name_base: train_uva_libero10