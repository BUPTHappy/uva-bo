# UMI multi-task training without VAE: RGB is patchified (MAR use_pixel_tokens).
# Images are still resized to 256 in resize_image(); use img_size 256, vae_stride 1, patch_size 16.
name: uva

# _self_ must be last so this file's `model:` overrides (e.g. predict_action, use_vae) are not
# overwritten by defaults from model/uva.yaml.
defaults:
  - task: umi_multi
  - model: uva
  - _self_

dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false

training:
  checkpoint_every: 1
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3050
  resume: true
  rollout_every: 1
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
  mixed_precision: 'bf16'
  deepspeed_config: null

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    # Prefer EEF position trajectory error for checkpoint selection (no real robot eval)
    monitor_key: val_eef_traj_error
    format_str: epoch={epoch:04d}-val_eef_traj_error={val_eef_traj_error:.3f}.ckpt
    k: 5
    mode: min

ema:
  _target_: unified_video_action.model.autoregressive.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

logging:
  group: null
  id: null
  mode: online
  name: train_uva_umi_multi_no_vae
  project: unified_video_action
  resume: true
  tags:
  - train_uva_umi_multi_no_vae
  - umi_multi
  - no_vae

multi_run:
  run_dir: data/outputs/train_uva_umi_multi_no_vae
  wandb_name_base: train_uva_umi_multi_no_vae

# Overrides default model/uva.yaml (VAE + latent MAR)
model:
  policy:
    use_vae: false
    vae_model_params: null
    autoregressive_model_params:
      pretrained_model_path: null
      img_size: 256
      vae_stride: 1
      patch_size: 16
      vae_embed_dim: 3
    action_model_params:
      predict_action: true
